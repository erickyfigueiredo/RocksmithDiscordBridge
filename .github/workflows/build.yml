name: Build and test Windows release
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify patch, install and restore
        shell: pwsh
        run: |
          node --test tests/patch.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/Signing.Tests.ps1
      - name: Build x86 RS_ASIO and native tests
        shell: pwsh
        run: ./Build.ps1
      - name: Verify audio protocol and windowless player
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package the player and collect licenses
        shell: pwsh
        run: |
          python -m pip install 'pyinstaller>=6,<7'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm RocksmithStreamBridge.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/collect_licenses.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build graphical Inno Setup installer and smoke test
        shell: pwsh
        run: |
          $taskCompiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ((-not (Test-Path -LiteralPath $taskCompiler)) -or ([version](Get-Item -LiteralPath $taskCompiler).VersionInfo.FileVersion -lt [version]'6.7.3')) {
            $taskBootstrap = Join-Path $env:RUNNER_TEMP 'inno-compiler-setup.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $taskBootstrap
            if ((Get-FileHash -LiteralPath $taskBootstrap).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup checksum mismatch' }
            $taskCompilerDir = Join-Path $env:RUNNER_TEMP 'InnoCompiler'
            $taskBootstrapProcess = Start-Process -FilePath $taskBootstrap -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$taskCompilerDir+'"') -Wait -PassThru -WindowStyle Hidden
            if ($taskBootstrapProcess.ExitCode -ne 0) { throw 'Compiler bootstrap failed' }
            $taskCompiler = Join-Path $taskCompilerDir 'ISCC.exe'
          }
          ./tools/BuildInstaller.ps1 -Compiler $taskCompiler
          ./tests/Installer.Smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-release
          path: |
            release/RocksmithDiscordBridge-Setup-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
  preview-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-x64-release
          path: release
      - name: Publish an experimental preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid VERSION'; exit 1; }
          tag="v${version}-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release/RocksmithDiscordBridge-Setup-x64.exe release/SHA256SUMS.txt --prerelease --target "$GITHUB_SHA" --title "$tag" --generate-notes --notes 'Windows x64 installer. See README for setup instructions and dependencies. Unsigned community preview.'
          python3 tools/prune_previews.py --current-tag "$tag" --apply
